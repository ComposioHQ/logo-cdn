<svg width="128" height="128" viewBox="0 0 377 377" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  /* Base fill = balanced mid-gray (also mirrored as a fill="" presentation attribute
     on each path, so CSS-less renderers and CSP-blocked document loads still paint a
     visible glyph instead of the root fill="none"). Safari renders ONLY this base (it
     ignores the media queries below), so it must read on both light and dark toolbars.
     Load-bearing — don't "fix" it to pure black or white.
     public/favicon.ico is a raster of this base fill; regenerate it in lockstep when
     this color changes:
       magick -background none favicon.svg -define icon:auto-resize=48,32,16 favicon.ico */
  path {
    fill: #8A8A8A;
  }
  @media (prefers-color-scheme: light) {
    path {
      fill: #18181B;
    }
  }
  @media (prefers-color-scheme: dark) {
    path {
      fill: #FAFAFA;
    }
  }
</style>
