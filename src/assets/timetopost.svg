<svg width="128" height="128" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- TimeToPost mark: 24h schedule dial, single amber tick + hand on the optimal minute -->
  <rect width="512" height="512" rx="116" fill="#08090D"/>

  <!-- outer dial ring -->
  <circle cx="256" cy="256" r="160" stroke="#FFFFFF" stroke-width="26" stroke-opacity="0.9"/>

  <!-- quarter ticks (00 / 06 / 12) -->
  <g stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-opacity="0.38">
    <line x1="256" y1="93" x2="256" y2="117"/>
    <line x1="419" y1="256" x2="395" y2="256"/>
    <line x1="256" y1="419" x2="256" y2="395"/>
    <line x1="93" y1="256" x2="117" y2="256"/>
  </g>

  <!-- optimal-minute glow + tick (amber) -->
  <circle cx="371.7" cy="171.9" r="56" fill="#FFB224" fill-opacity="0.22"/>
  <line x1="391.1" y1="157.8" x2="352.3" y2="186.1" stroke="#FFB224" stroke-width="34" stroke-linecap="round"/>

  <!-- hand pointing to the optimal minute -->
  <line x1="256" y1="256" x2="336.9" y2="197.2" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>

  <!-- hub -->
  <circle cx="256" cy="256" r="30" fill="#FFB224"/>
</svg>