<svg viewBox="0 0 180 180" width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1729"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background — iOS clips to rounded square automatically -->
  <rect width="180" height="180" fill="url(#bg)"/>
  <!-- Outer glow ring -->
  <circle cx="90" cy="72" r="32" fill="#F97316" opacity="0.06"/>
  <!-- Center node (large) -->
  <circle cx="90" cy="72" r="22" fill="url(#accent)" filter="url(#glow)"/>
  <circle cx="90" cy="72" r="22" fill="url(#accent)"/>
  <!-- Satellite nodes -->
  <circle cx="32" cy="136" r="14" fill="#F97316" opacity="0.9"/>
  <circle cx="148" cy="136" r="14" fill="#F97316" opacity="0.9"/>
  <circle cx="90" cy="152" r="11" fill="#FB923C" opacity="0.7"/>
  <!-- Connecting edges -->
  <line x1="90" y1="94" x2="32" y2="122" stroke="#F97316" stroke-width="3" opacity="0.6"/>
  <line x1="90" y1="94" x2="148" y2="122" stroke="#F97316" stroke-width="3" opacity="0.6"/>
  <line x1="90" y1="94" x2="90" y2="141" stroke="#FB923C" stroke-width="2.5" opacity="0.45"/>
  <line x1="32" y1="136" x2="90" y2="152" stroke="#F97316" stroke-width="2" opacity="0.35"/>
  <line x1="148" y1="136" x2="90" y2="152" stroke="#F97316" stroke-width="2" opacity="0.35"/>
</svg>