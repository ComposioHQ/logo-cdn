<!DOCTYPE html>
<html>
<head>
  <title>Dark Theme Logo Test</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .section { padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .light { background: #fff; color: #000; }
    .dark { background: #0d1117; color: #fff; }
    h2 { margin: 0; font-size: 18px; opacity: 0.7; }
    .logos { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
    .logo-card { text-align: center; }
    .logo-card img { width: 160px; height: 60px; object-fit: contain; }
    .logo-card p { font-size: 11px; opacity: 0.5; margin: 8px 0 0; }
  </style>
</head>
<body>
  <div class="section light">
    <h2>Light Background (default)</h2>
    <div class="logos">
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/gmail" />
        <p>gmail</p>
      </div>
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/figma" />
        <p>figma</p>
      </div>
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/github" />
        <p>github</p>
      </div>
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/notion" />
        <p>notion</p>
      </div>
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/linear" />
        <p>linear</p>
      </div>
    </div>
  </div>
  <div class="section dark">
    <h2>Dark Background (?theme=dark)</h2>
    <div class="logos">
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/gmail?theme=dark" />
        <p>gmail?theme=dark</p>
      </div>
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/figma?theme=dark" />
        <p>figma?theme=dark</p>
      </div>
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/github?theme=dark" />
        <p>github?theme=dark</p>
      </div>
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/notion?theme=dark" />
        <p>notion?theme=dark</p>
      </div>
      <div class="logo-card">
        <img src="https://logo-cdn-git-t3code-dark-theme-svg.preview.composio.dev/api/linear?theme=dark" />
        <p>linear?theme=dark</p>
      </div>
    </div>
  </div>
</body>
</html>
